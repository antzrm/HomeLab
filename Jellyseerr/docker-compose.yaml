services:
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    networks:
      proxy:
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Madrid
      - PUID=1000
      - PGID=1000
    ports:
      - 192.168.1.110:5055:5055
    volumes:
      - /home/minipc/docker/jellyseer/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

networks:
  proxy:
    external: true