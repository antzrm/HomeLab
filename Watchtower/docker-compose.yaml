networks: # Create a network to communicate both Gotify and Watchtower
  notify-net:

services:
  gotify: # Go to Gotify website first and create a token that will be used on WATCHTOWER_NOTIFICATION_URL
    image: gotify/server
    container_name: gotify
    networks:
      - notify-net
    ports:
      - 192.168.1.110:8070:80
    volumes:
      - /home/minipc/docker/gotify:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      TZ: Europe/Madrid

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    networks:
      - notify-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Europe/Madrid
      WATCHTOWER_CLEANUP: "true"       # remove old images after update (useful for saving space)
      WATCHTOWER_SCHEDULE: 0 0 4 * * * # run Watchtower every day at 4 am
      # WATCHTOWER_RUN_ONCE: true
      WATCHTOWER_WARN_ON_HEAD_FAILURE: "never"       # Disable HEAD warnings
      WATCHTOWER_DISABLE_CONTAINERS: "jellyfin rtorrent-rutorrent" # disable containers we do not want to be updated automatically
      WATCHTOWER_ROLLING_RESTART: "true"       # you can tell watchtower to do updates and restarts one by one - can be helpful
      WATCHTOWER_NOTIFICATIONS: "shoutrrr" # use shoutrrr to send notifications to Gotify
      WATCHTOWER_NOTIFICATION_URL: "gotify://gotify:80/GOTIFY_TOKEN?title=Watchtower&disabletls=yes" # use the token we created in Gotify to send notifications there
