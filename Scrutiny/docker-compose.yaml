services:
  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:master-omnibus
    cap_add: # need these special privileges to work with the disks
      - SYS_RAWIO
      - SYS_ADMIN
    ports:
      - "192.168.1.110:8181:8080" # webapp
      - "192.168.1.110:8086:8086" # influxDB admin
    environment:
      - COLLECTOR_CRON_SCHEDULE="0 14 * * *" # in this case, scrutiny will run disk check every day at 14:00
    volumes:
      - /run/udev:/run/udev:ro
      - ./config:/opt/scrutiny/config
      - ./influxdb:/opt/scrutiny/influxdb
    devices: # add all disks here (to check which /dev is each of them, use the command df -h for example)
      - "/dev/sda"
      - "/dev/sdb"
      - "/dev/sdc"
      - "/dev/sdd"
      - "/dev/sde"
    restart: unless-stopped
